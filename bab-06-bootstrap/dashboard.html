<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-4">

<!-- Profile -->
<div class="card mb-4 shadow">
  <div class="card-body d-flex align-items-center gap-3">
    <img src="https://i.pravatar.cc/100" class="rounded-circle">
    <div>
      <h5 class="mb-1">Galen</h5>
      <span class="badge bg-success">Aktif</span>
    </div>
  </div>
</div>

<!-- Statistik -->
<div class="row mb-4">
  <div class="col-md-4">
    <div class="card text-center shadow p-3">
      📚 <h5>Total SKS</h5><p>24</p>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center shadow p-3">
      ⭐ <h5>IPK</h5><p>3.75</p>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center shadow p-3">
      ✅ <h5>Lulus</h5><p>8 MK</p>
    </div>
  </div>
</div>

<!-- Table -->
<div class="table-responsive">
<table class="table table-bordered table-hover shadow">
<thead class="table-dark">
<tr>
<th>No</th><th>Mata Kuliah</th><th>SKS</th><th>Nilai</th><th>Angka</th><th>Aksi</th>
</tr>
</thead>

<tbody>
<tr>
<td>1</td>
<td>Web</td>
<td>3</td>
<td><span class="badge bg-success">A</span></td>
<td>4.0</td>
<td><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal">Detail</button></td>
</tr>

<tr>
<td>2</td>
<td>Database</td>
<td>3</td>
<td><span class="badge bg-primary">B</span></td>
<td>3.0</td>
<td><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal">Detail</button></td>
</tr>

<tr>
<td>3</td>
<td>Matematika</td>
<td>2</td>
<td><span class="badge bg-warning text-dark">C</span></td>
<td>2.0</td>
<td><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal">Detail</button></td>
</tr>

<tr>
<td>4</td>
<td>Algoritma</td>
<td>3</td>
<td><span class="badge bg-danger">D</span></td>
<td>1.0</td>
<td><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal">Detail</button></td>
</tr>

</tbody>
</table>
</div>

</div>

<!-- Modal -->
<div class="modal fade" id="modal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Detail Mata Kuliah</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
Detail informasi mata kuliah ditampilkan di sini.
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
