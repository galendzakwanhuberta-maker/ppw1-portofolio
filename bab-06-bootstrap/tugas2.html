<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Pendaftaran</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5">
<h2 class="mb-4">Form Pendaftaran</h2>

<div class="alert alert-success alert-dismissible fade" id="alertSukses">
  Data berhasil disimpan!
  <button class="btn-close" data-bs-dismiss="alert"></button>
</div>

<form>

<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">Nama Lengkap</label>
    <input type="text" class="form-control is-valid">
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">NIM</label>
    <input type="text" class="form-control is-invalid">
  </div>
</div>

<div class="mb-3">
  <label>Email</label>
  <input type="email" class="form-control">
</div>

<div class="mb-3">
  <label>Program Studi</label>
  <select class="form-select">
    <option>TRPL</option>
    <option>TRE</option>
  </select>
</div>

<div class="mb-3">
  <label>Semester</label>
  <select class="form-select">
    <option>1</option>
    <option>2</option>
  </select>
</div>

<div class="mb-3">
  <label>Alamat</label>
  <textarea class="form-control"></textarea>
</div>

<div class="mb-3">
  <label>Foto Profil</label>
  <input type="file" class="form-control">
</div>

<div class="d-flex gap-2">
  <button type="button" class="btn btn-primary" onclick="tampilAlert()">Simpan</button>
  <button type="reset" class="btn btn-secondary">Reset</button>
</div>

</form>
</div>

<script>
function tampilAlert() {
  document.getElementById("alertSukses").classList.add("show");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
